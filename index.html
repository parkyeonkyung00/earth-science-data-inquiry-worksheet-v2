<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="2022 개정 교육과정에 맞춘 지구과학 데이터 탐구와 비판적 검증을 위한 워크시트입니다.">
  <title>지구과학 데이터 탐구 프롬프트 워크시트</title><style>
:root {
  --bg: #EEF2F1;
  --surface: #FFFFFF;
  --sunk: #E3E9E7;
  --ink: #14201D;
  --muted: #56635F;
  --line: #CCD6D3;
  --accent: #145C78;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEBF1;
  --ok: #2C7A4B;
  --ok-soft: #DDF0E3;
  --warn: #9A6400;
  --warn-soft: #F6EBD3;
  --bad: #B0281F;
  --bad-soft: #F7DEDB;
  --grid: rgba(20, 92, 120, .07);
  --f-display: "Gowun Batang", "Nanum Myeongjo", "Batang", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 8px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1513;
    --surface: #161F1D;
    --sunk: #1D2826;
    --ink: #E1E9E6;
    --muted: #97A6A1;
    --line: #2B3835;
    --accent: #6CB6D3;
    --accent-ink: #082029;
    --accent-soft: #18323C;
    --ok: #6CC892;
    --ok-soft: #173326;
    --warn: #E2B04F;
    --warn-soft: #352A12;
    --bad: #F08A80;
    --bad-soft: #3A1C19;
    --grid: rgba(108, 182, 211, .06);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0E1513;
  --surface: #161F1D;
  --sunk: #1D2826;
  --ink: #E1E9E6;
  --muted: #97A6A1;
  --line: #2B3835;
  --accent: #6CB6D3;
  --accent-ink: #082029;
  --accent-soft: #18323C;
  --ok: #6CC892;
  --ok-soft: #173326;
  --warn: #E2B04F;
  --warn-soft: #352A12;
  --bad: #F08A80;
  --bad-soft: #3A1C19;
  --grid: rgba(108, 182, 211, .06);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0 16px 48px;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.65;
}
.wrap { max-width: 1180px; margin: 0 auto; }
h1, h2, h3 {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 700;
  letter-spacing: -.01em;
  text-wrap: balance;
}
h1 { font-size: 1.55rem; line-height: 1.25; }
h2 { font-size: 1.35rem; line-height: 1.3; }
h3 { font: 600 1.05rem/1.4 var(--f-body); }
p { margin: 0; }
a { color: var(--accent); overflow-wrap: anywhere; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-size: .86em; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.label {
  color: var(--muted);
  font-size: .74rem;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.top {
  position: sticky;
  z-index: 5;
  top: 0;
  margin: 0 -16px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
}
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.brand { display: flex; flex: 1 1 260px; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font: 700 1.12rem var(--f-display); overflow-wrap: anywhere; }
.brand span { overflow: hidden; color: var(--muted); font-size: .84rem; text-overflow: ellipsis; white-space: nowrap; }
.seg {
  display: inline-flex;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
}
.review-panel { margin-block: 20px; }
.review-table { width: 100%; min-width: 760px; border-collapse: collapse; }
.review-table th, .review-table td { padding: 10px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
.review-table caption { padding: 8px; text-align: left; font-weight: 600; }
.review-table .btn { margin-top: 8px; }
.data-how, .datacard { overflow-wrap: anywhere; }
.seg button {
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: none;
  color: var(--muted);
  cursor: pointer;
  font-weight: 500;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.survey-link { text-decoration: none; }
.survey-link[hidden] { display: none; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--surface);
  cursor: pointer;
  font-weight: 500;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: none; }
.btn.sm { padding: 4px 10px; font-size: .86rem; }
.loading, .error { max-width: 760px; margin: 28px auto 0; }
.error { padding: 16px; border: 1px solid var(--bad); border-radius: 10px; background: var(--bad-soft); }
.foot { max-width: 80ch; margin-top: 28px; color: var(--muted); font-size: .8rem; }
.foot-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 6px; color: var(--muted); font-size: .8rem; }
.intro-note {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-top: 18px;
  padding: 14px 16px;
  border: 1px solid var(--accent);
  border-radius: 10px;
  background: var(--accent-soft);
}
.intro-note p { margin-top: 4px; }

.teacher {
  display: grid;
  grid-template-columns: minmax(0, 340px) minmax(0, 1fr);
  gap: 24px;
  margin-top: 22px;
}
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tab {
  padding: 5px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  cursor: pointer;
  font-size: .9rem;
}
.tab[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.unit { margin-top: 14px; }
.unit h3 { margin-bottom: 6px; font-size: .92rem; }
.std {
  display: block;
  width: 100%;
  padding: 7px 10px;
  border: 0;
  border-radius: 6px;
  background: none;
  cursor: pointer;
  font-size: .88rem;
  line-height: 1.45;
  text-align: left;
}
.std:hover { background: var(--sunk); }
.std[aria-current="true"] { background: var(--accent-soft); }
.std .code { display: block; color: var(--muted); font: .78rem var(--f-mono); }
.std .act { display: block; color: var(--accent); font-weight: 600; }
.std.none, .std.none .act { color: var(--muted); font-weight: 400; }
.teacher-detail { min-width: 0; }
.panel {
  min-width: 0;
  padding: 22px 24px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
}
.panel + .panel { margin-top: 16px; }
.stack { display: grid; gap: 14px; }
.kv {
  display: grid;
  grid-template-columns: 7.5em minmax(0, 1fr);
  gap: 6px 14px;
  font-size: .92rem;
}
.kv dt { color: var(--muted); }
.kv dd { min-width: 0; margin: 0; }
.plain { margin: 0; padding-left: 1.1em; }
.plain li { margin: .15em 0; }
.std-quote {
  padding: 4px 0 4px 14px;
  border-left: 3px solid var(--accent);
  font: 1.02rem var(--f-display);
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 3px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  font-size: .84rem;
}
.tbl-wrap { overflow-x: auto; }
.levels { width: 100%; border-collapse: collapse; font-size: .88rem; }
.levels td { padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
.levels td:first-child { width: 2.2em; color: var(--accent); font: 500 1rem var(--f-mono); }
.field { display: grid; gap: 6px; min-width: 0; }
.note { padding: 10px 12px; border-radius: 8px; background: var(--sunk); font-size: .86rem; }
.ver-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.ver {
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  cursor: pointer;
  text-align: left;
}
.ver[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.ver b { color: var(--accent); font: 500 1.1rem var(--f-mono); }
.code-box {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border: 1px dashed var(--accent);
  border-radius: 10px;
}
.code-box .code-value { font-size: 1.3rem; font-weight: 500; letter-spacing: .06em; }
.activity-title { margin-top: 4px; }
.data-how, .panel-description, .version-description { margin-top: 4px; }
.level-description { margin-top: 8px; }
.copy-input { position: fixed; opacity: 0; }

.start { max-width: 760px; margin: 28px auto 0; }
.lead { max-width: 68ch; color: var(--muted); font-size: .94rem; }
.panel-description { margin-top: 4px; }
.join { display: flex; flex-wrap: wrap; gap: 8px; }
.join input {
  flex: 1 1 200px;
  min-width: 0;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--surface);
  font-family: var(--f-mono);
  letter-spacing: .06em;
  text-transform: uppercase;
}
.err { color: var(--bad); font-size: .88rem; }
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-top: 10px; }
.pick button {
  min-width: 0;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  cursor: pointer;
  line-height: 1.45;
  text-align: left;
}
.pick button:hover { border-color: var(--accent); }
.pick .code { color: var(--muted); font: .76rem var(--f-mono); }
.subject-picks { margin-top: 16px; }

.work { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 24px; margin-top: 20px; }
.rail { position: sticky; top: 70px; align-self: start; }
.rail ol { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
.rail ol button {
  display: grid;
  width: 100%;
  grid-template-columns: 2.6em minmax(0, 1fr) auto;
  align-items: center;
  gap: 6px;
  padding: 8px 10px;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--muted);
  cursor: pointer;
  font-size: .9rem;
  text-align: left;
}
.rail ol button .n { font: .8rem var(--f-mono); }
.rail ol button[aria-current="step"] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: inset 3px 0 0 var(--accent);
  font-weight: 600;
}
.dot { width: 8px; height: 8px; border: 1.5px solid var(--line); border-radius: 50%; }
.dot.done { border-color: var(--ok); background: var(--ok); }
.meta { display: grid; gap: 8px; margin-top: 16px; padding: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: .82rem; }
.vbadge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--muted); font-size: .8rem; }
.vbadge b { color: var(--accent); font-family: var(--f-mono); }
.sheet { min-width: 0; }
.sheet-head {
  padding: 18px 22px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background-color: var(--surface);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 18px 18px;
}
.sheet-head .code { color: var(--accent); font: .8rem var(--f-mono); }
.sec { display: grid; gap: 18px; min-width: 0; margin-top: 16px; padding: 22px 24px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.section-intro { gap: 6px; }
.sec-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; }
.sec-title .n { color: var(--accent); font: .95rem var(--f-mono); }
.field > label, .field > .flabel { font-size: .92rem; font-weight: 600; }
.field > label.check { font-size: .94rem; font-weight: 400; }
.field .hint { color: var(--muted); font-size: .84rem; }
input[type="text"], input[type="number"], select, textarea {
  width: 100%;
  min-width: 0;
  padding: 8px 11px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--bg);
}
textarea { min-height: 84px; resize: vertical; line-height: 1.6; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: 0; box-shadow: 0 0 0 3px var(--accent-soft); }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.fill { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: .98rem; line-height: 2.2; }
.fill input { width: auto; max-width: 260px; flex: 1 1 130px; padding: 4px 9px; border-style: dashed; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.card {
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  cursor: pointer;
  line-height: 1.45;
  text-align: left;
}
.card[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.card b { display: block; font-size: .92rem; }
.card span { color: var(--muted); font-size: .82rem; }
.card-label { display: flex; align-items: flex-start; gap: 8px; }
.card-label > input { flex: 0 0 auto; margin-top: .3em; accent-color: var(--accent); }
.card-label > span { flex: 1; }
.check { display: flex; align-items: flex-start; gap: 10px; font-size: .94rem; }
.check input { flex: 0 0 auto; margin-top: .35em; accent-color: var(--accent); }
.datacard { display: grid; gap: 8px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--sunk); }
.vars { width: 100%; border-collapse: collapse; font-size: .9rem; }
.vars th { padding: 6px 8px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: .8rem; font-weight: 600; text-align: left; }
.vars td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.vars td.u { font: .82rem var(--f-mono); }
.vars input[type="text"] { padding: 4px 8px; }
.prompt-out {
  max-height: 420px;
  overflow: auto;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--sunk);
  font: .84rem/1.7 var(--f-mono);
  white-space: pre-wrap;
}
.copyrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.scale { display: flex; flex-wrap: wrap; gap: 6px; }
.scale button {
  min-width: 3.2em;
  padding: 6px 8px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  cursor: pointer;
  font-family: var(--f-mono);
}
.scale button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.scale-legend { display: flex; max-width: 330px; justify-content: space-between; color: var(--muted); font-size: .78rem; }
.vrow { display: grid; gap: 8px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.vrow.ok { border-color: var(--ok); background: var(--ok-soft); }
.vrow.bad { border-color: var(--bad); background: var(--bad-soft); }
.vrow.unk { border-color: var(--warn); background: var(--warn-soft); }
.vrow-top { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px 14px; }
.vrow-top p { flex: 1 1 260px; min-width: 0; font-weight: 500; }
.tri { display: inline-flex; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.tri button { padding: 4px 10px; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: .84rem; }
.tri button + button { border-left: 1px solid var(--line); }
.tri button[aria-pressed="true"][data-v="ok"] { background: var(--ok); color: #fff; }
.tri button[aria-pressed="true"][data-v="bad"] { background: var(--bad); color: #fff; }
.tri button[aria-pressed="true"][data-v="unk"] { background: var(--warn); color: #fff; }
.vhint { color: var(--muted); font-size: .84rem; }
.tally { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { padding: 2px 10px; border-radius: 999px; font-size: .82rem; font-weight: 600; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.unk { background: var(--warn-soft); color: var(--warn); }
.predict-recap { padding: 6px 0 6px 12px; border-left: 3px solid var(--warn); font-size: .92rem; }
.round { display: grid; gap: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; }
.round h3 .mono { color: var(--accent); }
.starters { display: flex; flex-wrap: wrap; gap: 6px; }
.starters button { padding: 3px 9px; border: 1px dashed var(--line); border-radius: 6px; background: none; color: var(--muted); cursor: pointer; font-size: .84rem; }
.starters button:hover { border-color: var(--accent); color: var(--ink); }
.navrow { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-top: 16px; }
.details summary { color: var(--accent); cursor: pointer; font-size: .9rem; }
.details[open] summary { margin-bottom: 8px; }
.summary-out {
  max-height: 560px;
  overflow: auto;
  padding: 16px 18px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--sunk);
  font-size: .9rem;
  line-height: 1.75;
  white-space: pre-wrap;
}
.level-options { gap: 6px; }

@media (max-width: 820px) {
  .brand { flex-basis: 100%; }
  .teacher { grid-template-columns: minmax(0, 1fr); }
  .work { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .rail { position: static; }
  .rail ol { display: flex; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .rail li { flex: 0 0 auto; }
  .rail ol button { grid-template-columns: auto auto; padding: 6px 10px; white-space: nowrap; }
  .rail button .t, .rail button .dot, .rail .meta { display: none; }
  .rail button[aria-current="step"] .t { display: inline; }
  .ver-grid { grid-template-columns: minmax(0, 1fr); }
  .sec, .panel { padding: 18px 16px; }
  .kv { grid-template-columns: minmax(0, 1fr); }
  .kv dt { margin-top: 6px; }
}

@media (prefers-reduced-motion: no-preference) {
  main { animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translateY(4px); } to { transform: none; } }
}

@media print {
  @page { margin: 14mm; }
  body { padding: 0; background: #fff; color: #000; font-size: 11pt; }
  .top, .rail, .navrow, button, .foot-meta { display: none !important; }
  .wrap { max-width: none; }
  .teacher { display: block; margin: 0; }
  .teacher nav, .intro-note { display: none !important; }
  .work { display: block; margin: 0; }
  .sheet-head, .sec, .summary-out {
    max-height: none;
    overflow: visible;
    border-color: #999;
    background: #fff;
    color: #000;
    box-shadow: none;
  }
  .sheet-head { margin-bottom: 8mm; }
  .sec { break-inside: auto; }
  .summary-out { padding: 0; white-space: pre-wrap; }
  input, select, textarea { background: #fff !important; color: #000 !important; }
  details:not([open]) > *:not(summary) { display: none !important; }
  .foot { color: #444; }
}

</style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <b>지구과학 데이터 탐구 프롬프트 워크시트</b>
        <span id="topSub">2022 개정 교육과정 · 데이터 탐구</span>
      </div>
      <a id="surveyLink" class="btn sm survey-link" href="" target="_blank" rel="noopener noreferrer" hidden>설문 참여하기</a>
      <div class="seg" role="group" aria-label="화면 선택">
        <button id="modeT" type="button" aria-pressed="true">교사</button>
        <button id="modeS" type="button" aria-pressed="false">학생</button>
      </div>
    </div>

":"s 또는 분","r":"측정 시작부터 0 이상"},{"n":"온도","u":"°C","r":"실내 약 10 ~ 35"},{"n":"측정 위치","u":"(창가, 문 쪽, 냉난방기 앞 등)","r":""}],"tasks":["위치별 시간-온도 그래프를 한 그래프에 겹쳐 그리기","냉난방기를 켠 시각을 표시하고 위치별 온도 변화율(°C/분) 계산하기","온도가 거의 변하지 않게 될 때까지 걸린 시간을 위치별로 비교하기"],"chart":"시간-온도 꺾은선 그래프 (위치별 색 구분, 가동 시각 표시)","predict":"냉난방기 바로 앞과 가장 먼 곳의 온도 변화가 어떻게 다를지 예상해 보세요.","checks":[{"t":"시간 축 단위(초·분)가 원자료와 같은가?","h":"초 단위 자료를 분으로 착각하면 변화율이 60배 달라집니다."},{"t":"위치별 측정 시작 시각을 맞춰서 그렸는가?","h":"센서마다 기록을 시작한 시각이 다르면 그래프가 어긋나 보입니다."},{"t":"센서마다 처음 온도가 다르다면, 실제 차이인지 센서 오차인지 확인했는가?","h":"측정 전 같은 곳에 센서를 모아 두고 값을 비교해 보면 알 수 있습니다."},{"t":"갑자기 튀는 값(센서를 손으로 만진 순간 등)을 확인했는가?","h":""},{"t":"두세 곳의 측정으로 교실 전체를 일반화하지 않았는가?","h":""}],"pitfalls":["시간 열을 문자열로 읽어 축 순서가 뒤섞임","위치별 파일을 합치면서 시작 시각을 맞추지 않음","온도 변화율 단위를 °C/s와 °C/분으로 섞어 씀"],"tip":"학생이 직접 만든 데이터라 출처와 측정 조건을 섹션 2에 기록하는 연습이 자연스럽습니다. 측정값 자체의 오차를 의심해 보는 경험이 AI 결과 검증과 이어집니다.","time":"2차시","textbook":"비상교육 통합과학1 Ⅰ단원 탐구 '센서를 활용하여 교실 내 위치별 온도 측정·분석하기'. 교과서는 앱 그래프를 비교하고, 이 활동은 같은 자료를 AI로 분석·검증합니다."},{"id":"is1-0301","subj":"is1","code":"10통과1-03-01","title":"대형 화산 분출 뒤 지구 평균 기온 변화 찾기","questions":["1991년 피나투보 화산 분출 뒤 지구 평균 기온은 어떻게 변했을까?","지권의 화산 활동이 기권과 수권에 어떤 영향을 주었다고 볼 수 있을까?"],"data":{"name":"GISTEMP 전 지구 월평균 기온 편차","org":"NASA GISS","url":"https://data.giss.nasa.gov/gistemp/","how":"Tables of Global and Hemispheric Monthly Means에서 Global-mean monthly 자료(CSV)를 내려받습니다."},"vars":[{"n":"기온 편차","u":"°C (1951~1980 평균 기준)","r":"-0.6 ~ +1.5"},{"n":"연도·월","u":"년, 월","r":"1880 ~ 현재"}],"tasks":["1985~2000년 월별 기온 편차를 꺾은선 그래프로 그리기","분출 시점(1991년 6월)에 세로선 표시하기","분출 전 2년과 후 2년의 평균 편차 비교하기","화산 폭발로 어떤 권역에서 어떤 권역으로 물질과 에너지가 이동했는지 근거와 함께 논증 문장으로 정리하기"],"chart":"시간-기온 편차 꺾은선 그래프 (사건 표시선)","predict":"분출 뒤 기온이 오를지 내릴지, 변화 폭이 몇 °C 정도일지 예상해 보세요.","checks":[{"t":"y축이 '기온'이 아니라 '기온 편차'로 표시되었는가?","h":"편차는 기준 기간 평균과의 차이입니다. 15 °C 같은 값이 나오면 잘못 읽은 것입니다."},{"t":"분출 시점 표시가 1991년 6월에 정확히 있는가?","h":""},{"t":"변화 폭이 0.1~0.5 °C 수준인가?","h":"수 °C씩 변했다면 축 범위나 자료를 다시 확인하세요."},{"t":"AI가 화산 외 다른 요인(엘니뇨 등)을 함께 언급했는가, 또는 그 가능성을 내가 검토했는가?","h":"하나의 그래프로 원인을 단정할 수 없습니다."}],"pitfalls":["GISTEMP 자료의 '***' 결측 표시를 숫자로 읽지 못해 오류를 내거나 행을 통째로 버림","편차를 실제 기온으로 해석함","상관을 인과로 단정하는 설명을 덧붙임"],"tip":"화산재·이산화 황 에어로졸이 햇빛을 반사한다는 권역 간 상호작용 설명과 연결하세요. 원인 단정을 경계하는 섹션 6 성찰 질문과 잘 맞습니다.","time":"1~2차시","textbook":"비상교육 통합과학1 Ⅲ단원 탐구 '지구시스템의 물질 순환과 에너지 흐름 논증하기'(화산 폭발 사례). 교과서의 논증을 실제 기온 자료로 뒷받침합니다."},{"id":"is1-0302","subj":"is1","code":"10통과1-03-02","title":"지진의 깊이 분포로 판 경계 해석하기","questions":["대서양 중앙 해령, 칠레 해구, 산안드레아스 단층 주변에서 지진의 깊이 분포는 어떻게 다를까?","칠레 해구에서 남아메리카 대륙 쪽으로 갈수록 진원 깊이는 어떻게 달라질까?"],"data":{"name":"USGS 지진 목록 (Earthquake Catalog)","org":"미국 지질조사국(USGS)","url":"https://earthquake.usgs.gov/earthquakes/search/","how":"USGS Earthquake Catalog에서 기간과 규모 하한(예: M4.5)을 같게 설정하고, 대서양 중앙 해령·칠레 해구·산안드레아스 단층을 각각 포함하는 검색 영역을 정해 CSV로 내려받습니다. 영역의 경계와 자료 건수를 기록하고, 크기가 다른 영역의 지진 개수를 그대로 비교하지 않습니다."},"vars":[{"n":"위도·경도","u":"°","r":"위도 -90~90, 경도 -180~180"},{"n":"진원 깊이","u":"km","r":"0 ~ 700"},{"n":"규모","u":"(단위 없음)","r":"검색 조건 이상"}],"tasks":["진앙을 지도에 점으로 찍고 깊이를 색으로 구분하기","대서양 중앙 해령, 칠레 해구, 산안드레아스 단층 부근 지진의 깊이 분포를 비교하기","칠레 해구를 가로지르는 거리-깊이 단면도 그리기"],"chart":"산점도 지도 + 깊이 단면도 (y축 아래로 갈수록 깊음)","predict":"세 판 경계 중 깊은 지진(300 km 이상)이 나타나는 곳을 예상해 보세요.","checks":[{"t":"단면도에서 깊이가 아래쪽으로 커지도록 y축이 뒤집혀 있는가?","h":"깊은 지진이 위에 그려지면 실제 모습과 반대입니다."},{"t":"진원 깊이가 0~700 km 범위 안에 있는가?","h":"700 km보다 깊은 지진은 관측되지 않습니다."},{"t":"경도·위도를 뒤바꿔 찍지 않았는가?","h":"일본은 대략 북위 30~45°, 동경 130~145°입니다."},{"t":"깊은 지진이 수렴형 경계(섭입대)에서만 나타나는가?","h":"발산형·보존형 경계의 지진은 대부분 얕습니다."},{"t":"깊어지는 경향선이 어느 판이 어느 판 아래로 들어가는지와 맞는가?","h":""}],"pitfalls":["CSV의 latitude/longitude 열을 바꿔 그려 지도가 엉뚱한 위치에 찍힘","단면도의 깊이 축을 뒤집지 않음","날짜 범위를 지정하지 않아 최근 30일 자료만 사용함"],"tip":"섭입대의 경사진 지진대(와다티-베니오프대)가 드러나는지 확인하게 하세요. 지도 라이브러리 설치가 안 되는 환경이면 위도·경도 산점도로 대신해도 됩니다.","time":"2차시","textbook":"비상교육 통합과학1 Ⅲ단원 활동 '빅데이터 기반 프로그램으로 지진과 화산 활동이 자주 일어나는 지역 알아보기'와 판 경계 본문. 교과서는 프로그램으로 분포를 보고, 이 활동은 같은 종류의 자료를 내려받아 깊이까지 분석합니다."},{"id":"is2-0101","subj":"is2","code":"10통과2-01-01","title":"해양 생물 과의 수 변화로 대멸종 가설 평가하기","questions":["지질 시대 동안 해양 생물 과(科)의 수는 언제 크게 줄었을까?","내가 고른 대멸종의 원인 가설(기후 변화, 해양 무산소, 화산 폭발, 소행성 충돌)은 감소 폭과 회복 기간 자료로 뒷받침될까?"],"data":{"name":"Paleobiology Database 다양성 곡선","org":"Paleobiology Database","url":"https://paleobiodb.org","how":"Analyze/Download > Diversity curve 기능에서 분류 단위를 과(family)로 정해 해양 무척추동물의 지질 시대별 과의 수를 내려받습니다. 어렵다면 교사가 미리 정리한 CSV를 사용합니다."},"vars":[{"n":"시간","u":"Ma (백만 년 전)","r":"541 ~ 0"},{"n":"과의 수","u":"개","r":"0 이상"}],"tasks":["시간에 따른 과의 수 변화를 꺾은선 그래프로 그리기","5대 대멸종 시기를 표시하고 직전·직후 감소율(%) 계산하기","고른 대멸종 뒤 과의 수가 직전 수준으로 회복되기까지 걸린 시간 구하기"],"chart":"지질 시대-과의 수 꺾은선 그래프 (왼쪽이 과거)","predict":"가장 큰 감소가 일어난 시기를 예상하고, 그 시기에 어울리는 원인 가설을 하나 골라 보세요.","checks":[{"t":"x축이 왼쪽 과거(541 Ma)에서 오른쪽 현재(0 Ma)로 가는가?","h":"Ma 값을 그대로 그리면 축이 뒤집혀 시간이 거꾸로 흐릅니다."},{"t":"대멸종 표시가 지질시대 경계와 맞는가?","h":"예: 페름기 말 약 252 Ma, 백악기 말 약 66 Ma"},{"t":"감소율 계산이 (직전-직후)/직전 × 100인가?","h":""},{"t":"과의 수 감소를 종의 수 감소와 같은 크기로 단정하지 않았는가?","h":"과는 종보다 큰 분류 단위라 종 감소율은 더 큽니다."},{"t":"그래프의 감소 폭만으로 가설을 '증명'했다고 쓰지 않았는가?","h":"감소 폭과 회복 기간은 가설을 평가하는 근거 중 하나일 뿐입니다."}],"pitfalls":["Ma를 '년'으로 착각해 단위를 잘못 붙임","시간축을 뒤집지 않아 과거와 현재가 바뀜","대멸종 연대를 틀리게 표시함"],"tip":"지질시대 표준 연대는 국제층서위원회(ICS) 연대표와 대조하게 하세요. 섹션 4에서 '외부 기준과 대조하기' 습관을 기르기 좋습니다.","time":"2차시","textbook":"비상교육 통합과학2 Ⅰ단원 탐구 '대멸종의 원인을 설명하는 여러 가설 알아보기'. 교과서의 해양 생물 과의 수 그래프를 실제 자료로 직접 그려 봅니다."},{"id":"is2-0203","subj":"is2","code":"10통과2-02-03","title":"지구 평균 기온 상승과 엘니뇨 해 비교하기","questions":["최근 40년 동안 지구 평균 기온은 얼마나 올랐을까?","엘니뇨가 강했던 해에 지구 평균 기온이 특히 높았을까?","페트병 온실 효과 실험에서 확인한 경향이 실제 지구 관측 자료에서도 나타날까?"],"data":{"name":"GISTEMP 연평균 기온 편차 + 해양 니뇨 지수(ONI)","org":"NASA GISS / NOAA 기후예측센터","url":"https://data.giss.nasa.gov/gistemp/","how":"GISTEMP 연평균 자료와 NOAA CPC의 ONI 표(https://origin.cpc.ncep.noaa.gov/products/analysis_monitoring/ensostuff/ONI_v5.php)를 각각 내려받습니다."},"vars":[{"n":"기온 편차","u":"°C","r":"-0.5 ~ +1.5"},{"n":"ONI","u":"°C (해수면 온도 편차)","r":"-2.5 ~ +2.7"}],"tasks":["1980년 이후 기온 편차와 추세선을 그리고 10년당 상승률 구하기","ONI가 +0.5 °C 이상인 해를 엘니뇨 해로 표시하기","추세선에서 벗어난 정도(잔차)와 ONI의 관계 살펴보기"],"chart":"연도-기온 편차 꺾은선 + 추세선, 엘니뇨 해 강조","predict":"10년마다 기온이 대략 몇 °C씩 올랐을지 예상해 보세요.","checks":[{"t":"추세 상승률이 10년당 약 0.2 °C 수준인가?","h":"1 °C를 넘는다면 단위(년/10년)나 계산을 확인하세요."},{"t":"엘니뇨 판정 기준(+0.5 °C)을 정확히 썼는가?","h":"엄밀하게는 3개월 이동평균이 5번 연속 기준 이상이어야 합니다."},{"t":"두 자료의 기준 기간이 다름을 알고 해석했는가?","h":"GISTEMP와 ONI는 기준 평균 기간이 다릅니다."},{"t":"엘니뇨가 온난화의 원인이라는 결론으로 비약하지 않았는가?","h":"엘니뇨는 해마다 오르내림을 만들고, 장기 추세는 따로 봐야 합니다."}],"pitfalls":["ONI의 계절(DJF, JFM…) 열을 연도로 묶을 때 잘못 평균함","추세 기울기를 연 단위로 구하고 10년당이라고 표기함","엘니뇨와 온난화의 인과를 단정함"],"tip":"온실효과 강화의 장기 추세와 엘니뇨의 단기 변동을 구분하는 것이 성취기준의 핵심입니다. 섹션 6에서 'AI 설명 중 내가 동의하지 않은 부분'을 쓰게 하세요.","time":"2차시","textbook":"비상교육 통합과학2 Ⅱ단원 탐구 '지구 온난화에 따른 지구 열수지 변동'(페트병 실험)과 활동 '엘니뇨가 지구 환경과 인간 생활에 미치는 영향'."},{"id":"is2-0302","subj":"is2","code":"10통과2-03-02","title":"미세먼지 빅데이터의 결측값과 이상값 다루기","questions":["한 달 동안 우리 지역 PM10 농도 자료에는 결측과 이상값이 얼마나 있을까?","결측값을 어떻게 처리하느냐에 따라 월평균 농도가 달라질까?","충분히 검증되지 않은 데이터를 그대로 쓰면 어떤 문제가 생길까?"],"data":{"name":"대기오염 측정소 시간별 자료","org":"한국환경공단 에어코리아","url":"https://www.airkorea.or.kr","how":"통계정보 > 최종확정 측정자료에서 측정소와 기간을 골라 내려받습니다."},"vars":[{"n":"PM10","u":"µg/m³","r":"0 ~ 수백 (황사 때 1,000 이상 가능)"},{"n":"PM2.5","u":"µg/m³","r":"0 ~ 수백"},{"n":"측정 시각","u":"년-월-일 시","r":"1~24시"}],"tasks":["결측값과 음수 값의 개수 세기","결측 제외 / 0으로 채우기 / 앞뒤 값으로 보간하기 세 방법의 월평균 비교하기","시간별 농도 변화 그래프 그리기"],"chart":"시간-농도 꺾은선 그래프 + 처리 방법별 평균 비교 막대그래프","predict":"결측을 0으로 채우면 월평균이 커질지 작아질지 예상해 보세요.","checks":[{"t":"농도에 음수가 남아 있지 않은가?","h":"농도는 음수가 될 수 없습니다. -999 같은 값은 결측 표시입니다."},{"t":"결측 처리 방법을 AI가 명시했는가?","h":"말없이 행을 지웠다면 다시 물어보세요."},{"t":"24시가 다음 날 0시로 처리되는 등 시각 형식 문제는 없는가?","h":""},{"t":"평균이 처리 방법마다 어떻게 달라졌는지 숫자로 확인했는가?","h":""}],"pitfalls":["-999 같은 결측 코드를 실제 값으로 평균에 포함함","결측 행을 알리지 않고 삭제함","'24시' 표기를 날짜 형식으로 바꾸다 오류를 냄"],"tip":"교과서가 빅데이터의 문제점으로 드는 '충분히 검증되지 못한 데이터의 활용'과 '지나친 데이터 의존'을 직접 겪어 보는 활동입니다. 같은 데이터에서 처리 방식에 따라 결론이 달라지는 경험이 과신 방지의 핵심 사례가 됩니다.","time":"1~2차시","textbook":"비상교육 통합과학2 Ⅲ단원 탐구 '과학 기술 사회에서 빅데이터 활용의 장점과 문제점'(기상청 날씨마루 사례). 교과서는 조사·토의 중심이고, 이 활동은 실제 데이터로 문제점을 확인합니다."},{"id":"es-0101","subj":"es","code":"12지구01-01","title":"인공위성과 ARGO 자료로 해수의 성질 비교하기","questions":["2월과 8월에 북반구, 적도 부근, 남반구 해역의 표층 수온은 어떻게 다를까?","같은 해역이라도 계절에 따라 수온과 염분의 연직 분포, T-S도 모양이 달라질까?"],"data":{"name":"천리안위성 2A호 해수면 온도 + ARGO 플로트 수온·염분 자료","org":"국가기상위성센터 / 국립기상과학원 ARGO","url":"https://nmsc.kma.go.kr","how":"표층 수온은 국가기상위성센터의 위성 영상(해수면 온도 10일 합성)에서 해역별 값을 읽어 표로 정리합니다. 연직 자료는 국립기상과학원 ARGO(http://argo.nims.go.kr)에서 플로트를 골라 수심별 수온·염분 자료를 내려받습니다. 우리나라 연안을 더 자세히 보려면 KODC 정선해양관측 자료(https://www.nifs.go.kr/kodc/)를 함께 씁니다."},"vars":[{"n":"표층 수온","u":"°C","r":"-2 ~ 32"},{"n":"수심","u":"m (dbar로 기록되기도 함)","r":"0 ~ 2,000 (ARGO)"},{"n":"수온","u":"°C","r":"-2 ~ 30"},{"n":"염분","u":"psu","r":"32 ~ 37 (대양)"},{"n":"밀도","u":"g/cm³","r":"약 1.020 ~ 1.030"}],"tasks":["해역(북반구·적도·남반구)과 계절(2월·8월)별 표층 수온을 표와 막대그래프로 비교하기","ARGO 수심-수온, 수심-염분 그래프 그리기 (깊이 축 아래로)","T-S도에 등밀도선을 함께 그리고 계절별로 비교하기"],"chart":"해역·계절별 막대그래프 + 연직 분포 그래프 + 등밀도선이 있는 T-S도","predict":"8월에 북반구(제주도 부근)와 남반구(시드니 부근) 해역 중 어느 쪽 표층 수온이 더 높을지, 그 이유와 함께 예상해 보세요.","checks":[{"t":"계절이 반대인 남반구에서 2월·8월 수온 관계가 북반구와 반대로 나타나는가?","h":"남반구는 8월이 겨울입니다."},{"t":"수심 축이 아래로 갈수록 깊어지게 그려졌는가?","h":"해양 연직 분포는 수심을 세로축 아래 방향으로 둡니다."},{"t":"T-S도 등밀도선의 숫자를 바르게 해석했는가?","h":"등밀도선 24는 1.024 g/cm³를 뜻합니다."},{"t":"염분이 32~37 psu 근처이고, 깊어질수록 수온이 낮아지는가?","h":"0이나 100 같은 값은 단위·열 혼동입니다."},{"t":"ARGO 자료의 압력(dbar)을 수심(m)처럼 썼다면 그 사실을 밝혔는가?","h":"1 dbar는 대략 수심 1 m에 해당하지만 같은 값은 아닙니다."}],"pitfalls":["수심을 x축에 두고 위로 증가하게 그림","T-S도에 등밀도선 없이 점만 찍고 밀도를 해석함","ARGO 품질 표시(QC flag)가 나쁜 값을 그대로 사용함","남반구의 계절을 북반구와 같게 해석함"],"tip":"교과서 탐구는 위성 영상과 ARGO 누리집 그래프를 눈으로 비교하는 데서 끝납니다. 이 활동은 같은 자료를 내려받아 AI로 직접 그래프를 만들고 검증하는 단계로 확장한 것입니다. 성취수준 A의 '디지털 실측 자료를 그래프로 변환하고 해석'에 해당합니다.","time":"2차시","textbook":"미래엔 지구과학 Ⅰ단원 탐구 '인공위성 및 ARGO 자료로 해수의 성질 비교하기' (탐구 1 위성 표층 수온, 탐구 2 ARGO T-S도)"},{"id":"es-0103","subj":"es","code":"12지구01-03","title":"한랭 전선 통과 전후의 날씨 변화 분석하기","questions":["한랭 전선이 지나갈 때 기온, 기압, 풍향은 어떻게 변할까?","관측 자료만으로 전선이 지나간 시각을 찾을 수 있을까?"],"data":{"name":"종관기상 edict":"반감기가 두 번 지나면 모원소가 몇 % 남을지 예상해 보세요.","checks":[{"t":"모원소와 자원소 비율의 합이 100 %인가?","h":""},{"t":"감소 곡선이 직선이 아니라 지수 곡선으로 맞춰졌는가?","h":"직선으로 맞추면 반감기가 틀리게 나옵니다."},{"t":"25 % 남았을 때 연령이 반감기의 2배로 계산되었는가?","h":""},{"t":"수업용 자료와 실제 암석 자료의 차이를 이해했는가?","h":""}],"pitfalls":["선형 회귀로 반감기를 구함","남은 비율이 아니라 자원소 비율로 연령을 계산함","로그 계산에서 자연로그와 상용로그를 섞음"],"tip":"실제 데이터가 아닌 수업용 자료를 쓰는 활동이므로, 섹션 2에서 '자료의 출처와 성격'을 정직하게 기록하는 연습이 됩니다.","time":"1차시","textbook":"미래엔 지구과학 Ⅱ단원 탐구 '지질 단면도에서 층서 대비하기' 중 탐구 2 절대연령 계산하기"},{"id":"es-0202","subj":"es","code":"12지구01-06","title":"남극 빙하 코어로 본 과거 40만 년의 기후 변화","alignment":"빙하 코어는 과거 기후와 자연적 기후변화 요인을 해석하는 자료이므로 [12지구01-06]에 연결합니다. 기별 지질시대 구분과 지층·화석을 요구하는 [12지구02-02]의 대체 활동으로 사용하지 않습니다. 현대 인위적 요인과 해결 방안은 같은 기준의 다른 활동과 함께 탐구합니다.","questions":["과거 40만 년 동안 남극의 기온은 어떤 주기로 변했을까?","기온 변화와 이산화 탄소 농도 변화는 함께 움직였을까?","빙하 코어는 다른 고기후 연구 방법보다 어떤 점에서 유리하고, 어떤 한계가 있을까?"],"data":{"name":"보스토크 빙하 코어 자료","org":"NOAA 국립환경정보센터(NCEI) 고기후 자료","url":"https://www.ncei.noaa.gov/products/paleoclimatology/ice-core","how":"Vostok ice core의 기온 편차(중수소 기반)와 CO₂(기포 분석) 자료를 내려받습니다."},"vars":[{"n":"연대","u":"년 전 (BP)","r":"0 ~ 약 420,000"},{"n":"기온 편차","u":"°C (현재 대비)","r":"약 -9 ~ +3"},{"n":"CO₂ 농도","u":"ppm","r":"약 180 ~ 300"}],"tasks":["연대-기온 편차, 연대-CO₂ 그래프를 위아래로 나란히 그리기","빙기와 간빙기 구간 표시하기","두 변수의 상관 계수 구하기","빙하 코어 자료의 장점과 한계를 다른 고기후 연구 방법(꽃가루 화석, 나이테, 동굴 생성물 등)과 비교해 표로 정리하기"],"chart":"공통 시간축 2단 그래프 (왼쪽이 과거)","predict":"빙기와 간빙기가 대략 몇 만 년 주기로 반복될지 예상해 보세요.","checks":[{"t":"x축이 왼쪽 과거에서 오른쪽 현재로 가는가?","h":"'년 전' 값을 그대로 그리면 시간이 거꾸로 흐릅니다."},{"t":"과거 CO₂가 180~300 ppm 범위에 머무르는가?","h":"400 ppm 이상이 나오면 현대 자료가 섞였는지 확인하세요."},{"t":"두 자료의 연대 측정 간격이 달라 맞춰야 함을 처리했는가?","h":"기온과 CO₂ 자료는 연대 간격이 다릅니다."},{"t":"약 10만 년 주기를 밀란코비치 주기 등과 연결해 해석했는가?","h":""}],"pitfalls":["간격이 다른 두 자료를 행 번호로 짝지어 상관을 계산함","시간축을 뒤집지 않음","현재 CO₂(약 420 ppm)를 같은 그래프에 단위 없이 이어 붙임"],"tip":"성취수준 탐구 활동 '고기후 연구 방법 비교·평가하기'와 연결됩니다. 빙하 코어의 장점과 한계를 섹션 6에서 정리하게 하세요.","time":"2차시","textbook":"미래엔 지구과학 Ⅱ단원 탐구 '고기후 연구 방법 비교·평가하기'. 교과서는 연구 방법을 조사·비교하고, 이 활동은 그중 빙하 시추물 자료를 직접 분석합니다."},{"id":"es-0302","subj":"es","code":"12지구03-02","title":"별 목록 자료로 H-R도 그리기","questions":["가까운 별들을 표면 온도와 광도로 나타내면 어떤 무리를 이룰까?","분광형에 따라 별의 절대 등급은 어떻게 다를까?"],"data":{"name":"HYG 별 목록","org":"HYG Database (Hipparcos·Yale·Gliese 통합 목록)","url":"https://github.com/astronexus/HYG-Database","how":"교과서 탐구처럼 가까운 별 20개 안팎의 분광형과 절대 등급 표를 직접 입력해 CSV로 만들거나, HYG 저장소의 CSV에서 거리 50 pc 이내 별을 골라 분광형(spect), 절대 등급(absmag), 색지수(ci) 열을 씁니다."},"vars":[{"n":"색지수 B-V","u":"등급","r":"약 -0.4 ~ 2.0"},{"n":"절대 등급","u":"등급","r":"약 -10 ~ +17"},{"n":"분광형","u":"O, B, A, F, G, K, M","r":""}],"tasks":["분광형을 O, B, A, F, G, K, M 순서로 x축에 놓고 절대 등급과 함께 산점도 그리기","같은 자료를 색지수-절대 등급 산점도로도 그려 비교하기","주계열, 적색 거성, 백색 왜성 영역 표시하기"],"chart":"H-R도 산점도 (y축 뒤집기: 밝은 별이 위)","predict":"태양(G2형, 절대 등급 약 4.8)이 그래프의 어디쯤 놓일지 표시해 보세요.","checks":[{"t":"x축 분광형이 알파벳 순서가 아니라 O B A F G K M 순서인가?","h":"AI가 문자열을 알파벳순(A B F G K M O)으로 정렬하는 실수가 잦습니다."},{"t":"y축이 뒤집혀 밝은 별(등급 작음)이 위에 있는가?","h":"등급은 숫자가 작을수록 밝습니다."},{"t":"x축 왼쪽이 고온(푸른 별), 오른쪽이 저온(붉은 별)인가?","h":"색지수가 작을수록 고온입니다. 온도로 바꾸어 그리면 축이 오른쪽으로 갈수록 낮아져야 합니다."},{"t":"주계열이 왼쪽 위에서 오른쪽 아래로 이어지는가?","h":""},{"t":"색지수가 없는 별을 어떻게 처리했는지 확인했는가?","h":""}],"pitfalls":["분광형을 알파벳순으로 정렬해 O형 별이 오른쪽 끝에 놓임","절대 등급 축을 뒤집지 않아 그림이 위아래로 뒤바뀜","표면 온도로 바꿀 때 축 방향을 일반 그래프처럼 왼쪽 저온으로 그림","겉보기 등급(mag)과 절대 등급(absmag)을 혼동함"],"tip":"성취수준 탐구 활동 '별의 분광형과 광도 자료를 분석하여 H-R도 작성하기'와 그대로 맞습니다. 축 방향 오류는 AI가 매우 자주 내는 실수라 섹션 4 검증 연습에 좋습니다.","time":"2차시","textbook":"미래엔 지구과학 Ⅲ단원 탐구 '별의 분광형과 절대 등급 자료를 분석하여 H-R도 작성하기'. 교과서는 손으로 그리고, 이 활동은 AI로 그린 뒤 축 방향을 검증합니다."},{"id":"es-0304","subj":"es","code":"12지구03-04","title":"인공지능 은하 분류 결과를 데이터로 검증하기","questions":["내가 학습시킨 인공지능은 타원·나선·불규칙 은하를 얼마나 정확하게 분류할까?","어떤 종류의 은하에서 인공지능이 가장 자주 틀릴까?"],"data":{"name":"은하 사진 + 인공지능 분류 결과표","org":"유럽우주기구 허블 사진 자료 / Galaxy Zoo","url":"https://esahubble.org/images/archive/category/galaxies/","how":"교과서 탐구처럼 은하 사진을 종류별로 모아 이미지 학습 도구(예: 티처블 머신)로 학습시킵니다. 학습에 쓰지 않은 새 사진으로 분류해 본 결과를 '사진 이름, 실제 종류, AI 분류, 확신도' 표로 정리합니다. 사람의 분류와 비교하려면 Galaxy Zoo 자료(https://data.galaxyzoo.org)를 씁니다."},"vars":[{"n":"실제 종류","u":"타원 / 나선 / 불규칙","r":""},{"n":"AI 분류","u":"타원 / 나선 / 불규칙","r":""},{"n":"확신도","u":"% 또는 (0~1)","r":"0 ~ 100 %"},{"n":"종류별 학습 사진 수","u":"장","r":"종류마다 5장 이상"}],"tasks":["실제 종류와 AI 분류로 혼동 행렬(3×3 표) 만들기","전체 정확도와 종류별 정확도 계산하기","틀린 사진만 모아 확신도와 함께 정리하기"],"chart":"혼동 행렬 표(색으로 개수 표시) + 종류별 정확도 막대그래프","predict":"세 종류 중 인공지능이 가장 많이 틀릴 은하를 예상하고 이유를 써 보세요.","checks":[{"t":"학습에 쓴 사진으로 시험하지 않았는가?","h":"학습에 쓴 사진으로 시험하면 정확도가 실제보다 높게 나옵니다."},{"t":"혼동 행렬의 모든 칸을 더한 값이 시험한 사진 수와 같은가?","h":""},{"t":"종류별 사진 수가 크게 다르지 않은가?","h":"한 종류의 사진만 많으면 AI가 그 종류로 쏠려 분류합니다."},{"t":"확신도가 높은데 틀린 사례가 있는가, 있다면 그 사진의 특징은?","h":"확신도가 높다고 정답이라는 뜻은 아닙니다."},{"t":"허블 분류 기준(모양, 나선팔, 막대 구조)으로 틀린 이유를 설명할 수 있는가?","h":""}],"pitfalls":["학습용 사진과 시험용 사진을 섞어 정확도를 부풀림","혼동 행렬의 행(실제)과 열(예측)을 바꿔 해석함","확신도가 높으면 정답이라고 설명함","종류별 사진 수 불균형을 무시함"],"tip":"교과서 탐구가 '인공지능으로 분류하기'에서 끝난다면, 이 활동은 그 결과를 검증하는 단계입니다. AI 분류기의 확신도를 무비판적으로 믿는 문제가 그대로 드러나 과신 방지 학습에 특히 알맞습니다.","time":"2차시","textbook":"미래엔 지구과학 Ⅲ단원 탐구 '빅데이터와 인공지능을 이용하여 은하 분류하기'. 교과서 탐구 3번(분류 정확도를 높이는 방법)과 직접 이어집니다."},{"id":"es-0305","subj":"es","code":"12지구03-05","title":"외부 은하의 거리와 후퇴 속도로 허블 상수 구하기","questions":["멀리 있는 은하일수록 더 빨리 멀어질까?","관측 자료로 구한 허블 상수는 얼마이고, 우주의 나이는 대략 얼마로 추정될까?"],"data":{"name":"외부 은하 거리·적색 이동 자료","org":"NASA/IPAC 외부은하 데이터베이스(NED)","url":"https://ned.ipac.caltech.edu","how":"교과서 탐구처럼 은하별 거리(Mpc)와 흡수선의 관측 파장을 표로 정리하거나, NED에서 은하 10~20개의 거리와 적색 이동(z)을 찾아 씁니다."},"vars":[{"n":"거리","u":"Mpc","r":"수 ~ 수백"},{"n":"후퇴 속도","u":"km/s","r":"수백 ~ 수만"},{"n":"흡수선 관측 파장","u":"nm","r":"고유 파장보다 큼 (예: 칼슘 395 nm)"},{"n":"적색 이동 z","u":"(단위 없음)","r":"0 ~ 0.1"}],"tasks":["흡수선 파장 변화로 후퇴 속도 구하기 (v = c × Δλ / λ₀)","거리-후퇴 속도 산점도와 원점을 지나는 추세선 그리기","기울기로 허블 상수(km/s/Mpc) 구하기","1/H₀로 우주 나이 어림하기"],"chart":"산점도 + 원점 통과 추세선","predict":"허블 상수 값이 대략 어느 범위일지 예상해 보세요.","checks":[{"t":"후퇴 속도 계산에 빛의 속도를 km/s 단위(약 3 × 10⁵ km/s)로 썼는가?","h":"m/s로 쓰면 속도가 1000배 커집니다."},{"t":"허블 상수가 약 60~80 km/s/Mpc 범위인가?","h":"현재 측정값은 약 67~73입니다. 크게 벗어나면 단위 변환을 의심하세요."},{"t":"우주 나이 계산에서 Mpc를 km로, 초를 년으로 바르게 바꾸었는가?","h":"1 Mpc ≈ 3.086 × 10¹⁹ km"},{"t":"추세선이 원점을 지나도록 맞췄는가?","h":"v = H₀d 형태여야 합니다."},{"t":"아주 가까운 은하(국부 은하군)의 고유 운동을 고려했는가?","h":"가까운 은하는 우주 팽창보다 고유 운동의 영향이 큽니다."}],"pitfalls":["Mpc와 광년을 섞어 허블 상수가 엉뚱한 크기로 나옴","절편이 있는 추세선을 써서 기울기가 달라짐","1/H₀ 계산에서 단위 변환을 빠뜨림"],"tip":"허블의 1929년 원래 값(약 500 km/s/Mpc)과 현재 값을 비교하며 '측정 방법이 발전하면 결론도 바뀐다'는 과학의 본성을 다룰 수 있습니다.","time":"1~2차시","textbook":"미래엔 지구과학 Ⅲ단원 탐구 '외부 은하의 거리와 후퇴 속도의 관계 알아보기'"},{"id":"ess-0102","subj":"ess","code":"12지시01-02","title":"관측소별 이산화 탄소 계절 변동으로 탄소 순환 추적하기","questions":["북반구와 남반구 관측소의 CO₂ 계절 변동 폭은 왜 다를까?","CO₂ 농도가 가장 높은 달과 낮은 달은 육상 생물권 활동과 어떤 관계가 있을까?"],"data":{"name":"관측소별 대기 CO₂ 월평균","org":"NOAA 지구감시연구소(GML)","url":"https://gml.noaa.gov/ccgg/trends/","how":"마우나로아(MLO)와 남극점(SPO) 월평균 자료를 내려받습니다. 배로(BRW, 알래스카) 자료를 더하면 비교가 더 뚜렷합니다."},"vars":[{"n":"CO₂ 농도","u":"ppm","r":"약 400 ~ 430 (최근)"},{"n":"연·월","u":"","r":""}],"tasks":["최근 5년 월평균을 관측소별로 겹쳐 그리기","관측소별 연간 진폭(최댓값-최솟값) 비교하기","월별 평균으로 계절 주기 모양 그리기"],"chart":"관측소별 시계열 꺾은선 + 월별 주기 그래프","predict":"세 관측소 중 계절 진폭이 가장 큰 곳과 가장 작은 곳을 예상하고 이유를 써 보세요.","checks":[{"t":"북반구 관측소의 CO₂ 최대가 봄(5월 무렵), 최소가 가을(9~10월 무렵)인가?","h":"광합성이 활발한 여름에 CO₂가 줄어듭니다."},{"t":"남극점 진폭이 마우나로아보다 작은가?","h":"남반구는 육지와 식생이 적습니다."},{"t":"월평균 결측(예: -99.99) 값을 제외했는가?","h":""},{"t":"장기 증가 추세와 계절 변동을 구분해서 설명했는가?","h":""}],"pitfalls":["결측 코드 -99.99를 값으로 그려 그래프가 아래로 꺾임","탈계절화(deseasonalized) 열과 원자료 열을 혼동함","계절 변동을 해양 흡수만으로 설명함"],"tip":"지권·수권·기권·생물권 사이 탄소 순환을 실제 자료로 '추적'하는 활동입니다. 섹션 6에서 탄소가 어디서 어디로 이동했는지 화살표 문장으로 정리하게 하세요.","time":"2차시","textbook":"미래엔 지구시스템과학 Ⅰ단원 물·탄소·산소 순환 본문과 연계한 보충 활동입니다. 교과서에는 같은 자료 탐구가 없습니다."},{"id":"ess-0105","subj":"ess","code":"12지시01-05","title":"한반도 지진 분포와 지진파 자료로 지각 두께 구하기","questions":["최근 20년 동안 한반도 지진은 규모 범위별로 어디에 많이 발생했을까?","여러 관측소의 지진파 도착 시간으로 우리나라 지각의 두께를 구할 수 있을까?"],"data":{"name":"국내 지진 목록 + 관측소별 진앙 거리·P파 도착 시간","org":"기상청 날씨누리","url":"https://www.weather.go.kr","how":"지진·화산 > 지진 조회 > 국내에서 최근 20년, 규모 범위를 정해 스프레드시트로 내려받습니다. 지각 두께 실습은 한 지진에 대해 관측소별 진앙 거리(km)와 진원 시각부터 잰 P파 도착 시간(s)이 함께 있는 표(교과서 또는 교사 제공 자료)를 씁니다. 속도-깊이 표가 아니라 거리-도착 시간 자료를 분석합니다."},"vars":[{"n":"규모","u":"(단위 없음)","r":"2.0 ~ 5.8 (2016 경주 최대)"},{"n":"진원 깊이","u":"km","r":"대부분 20 이하"},{"n":"진앙 거리","u":"km","r":"0 이상"},{"n":"P파 도착 시간","u":"s (지진 발생 후)","r":"0 이상"}],"tasks":["규모 범위(2~3, 3~4, 4~5, 5~6)별로 나누어 진앙 분포 지도 그리기","x축을 진앙 거리(km), y축을 P파 도착 시간(s)으로 한 주시 곡선을 그리고 근거리 직접파와 원거리 굴절파 구간에 각각 추세선 긋기","두 추세선의 교차 거리 x_c를 읽고 기울기(s/km)의 역수로 지각파 속도 v1과 맨틀 굴절파 속도 v2를 구한 뒤, h = (x_c/2) × √((v2−v1)/(v2+v1))로 지각 두께 어림하기"],"chart":"규모별 색 구분 진앙 지도 + 주시 곡선(x축 진앙 거리 km, y축 P파 도착 시간 s, 두 구간 추세선)","predict":"우리나라 지각의 두께가 몇 km쯤일지 예상해 보세요.","checks":[{"t":"그래프가 진앙 거리(km)-P파 도착 시간(s)이고, 각 추세선 기울기(s/km)의 역수로 속도(km/s)를 구했는가?","h":"기울기는 느린 정도(s/km)이고 속도는 그 역수(km/s)입니다. 근거리 지각파는 약 5.5~7.0 km/s, 원거리 맨틀 굴절파는 약 8.0~8.5 km/s인지 확인하세요."},{"t":"두 구간 추세선의 교차 거리 x_c로 지각 두께를 계산했는가?","h":"수평 2층 굴절 모형에서 h = (x_c/2) × √((v2−v1)/(v2+v1))이며, v1은 지각파 속도, v2는 맨틀 굴절파 속도입니다. 단일 추세선이나 속도-깊이 그래프의 8.0 km/s 도달점으로 판정하지 마세요."},{"t":"계산한 지각 두께가 약 30~35 km 범위인가?","h":"우리나라 지각의 근사 범위입니다. 크게 벗어나면 거리·시간 단위, 두 구간의 선택, 교차 거리와 식을 확인하세요."},{"t":"규모 범위의 경계값(예: 3.0)을 어느 구간에 넣었는지 일관되게 처리했는가?","h":"'이상 ~ 미만'으로 나누어야 중복이 없습니다."},{"t":"규모와 진도를 혼동하지 않았는가?","h":"규모는 에너지, 진도는 지역별 흔들림 정도입니다."},{"t":"2016년 경주, 2017년 포항 지진의 여진이 지역별 개수에 큰 영향을 준다는 점을 고려했는가?","h":""}],"pitfalls":["도착 시간-거리 그래프의 기울기(s/km)를 속도(km/s)로 그대로 사용함","두 구간 대신 하나의 추세선만 그리거나 교차 거리를 지각 두께로 바로 간주함","규모와 진도를 같은 것으로 설명함","여진을 포함한 개수를 '지진 위험 증가'로 단정함"],"tip":"교과서의 두 탐구(한반도 지진 분포, 지각 두께 구하기)를 한 활동으로 묶었습니다. 지각 두께 실습은 진앙 거리-도착 시간 주시 곡선에서 직접파·굴절파의 두 추세선을 비교합니다. 수평 2층·일정 속도 근사에서 교차 거리 x_c와 각 구간 속도(v1, v2)로 h = (x_c/2) × √((v2−v1)/(v2+v1))를 어림합니다. 적용 가정과 단위를 확인하고, AI가 다른 그래프나 식을 사용하면 교과서 및 제공 자료와 대조하세요.","time":"2차시","textbook":"미래엔 지구시스템과학 Ⅰ단원 탐구 '한반도 지진의 분포 특성과 지진 발생 가능성 예측하기', '지진파 자료를 활용하여 지각의 두께 구하기'"},{"id":"ess-0204","subj":"ess","code":"12지시02-04","title":"실시간 조위 자료로 서해와 동해의 조석 양상 비교","questions":["인천과 묵호의 하루 조위 변화는 어떻게 다를까?","만조와 간조는 하루에 몇 번, 몇 시간 간격으로 나타날까?"],"data":{"name":"실시간 조위 자료","org":"국립해양조사원","url":"https://www.khoa.go.kr","how":"해양정보 > 해양생활 > 실시간 고조 정보에서 인천과 묵호(또는 속초) 관측소의 조위 그래프와 자료를 확인합니다. 해외 관측소와 비교하려면 하와이대학교 해수면 센터(https://uhslc.soest.hawaii.edu) 자료를 씁니다."},"vars":[{"n":"조위","u":"cm","r":"인천 약 0 ~ 900, 동해 수십 cm 변화"},{"n":"관측 시각","u":"분 단위","r":""}],"tasks":["두 관측소의 3일간 조위 그래프를 겹쳐 그리기","만조 시각을 찾아 간격 계산하기","하루 조차(최고-최저) 비교하기"],"chart":"시계열 꺾은선 (관측소별 색 구분)","predict":"인천의 조차가 묵호의 몇 배쯤 될지 예상해 보세요.","checks":[{"t":"만조 간격이 약 12시간 25분 안팎인가?","h":"반일주조는 하루에 약 50분씩 늦어집니다."},{"t":"조위 단위가 cm인지 m인지 확인했는가?","h":"인천 조위가 9 cm처럼 보이면 단위 오류입니다."},{"t":"두 관측소의 기준면이 다를 수 있음을 알고 조위 절댓값보다 조차를 비교했는가?","h":""},{"t":"실측 조위와 예측 조위 열을 구분해서 썼는가?","h":"조위 자료에는 실측값과 예측값이 함께 있는 경우가 많습니다."},{"t":"측정 오류(급격한 튐) 값을 확인했는가?","h":""}],"pitfalls":["두 관측소 기준면 차이를 무시하고 조위 절댓값을 비교함","분 단위 자료를 시간 단위로 묶을 때 평균을 내서 만조 시각이 흐려짐","동해의 작은 조차를 '조석이 없다'고 단정함"],"tip":"성취수준 탐구 활동 '실시간 자료를 이용한 조석 현상의 패턴 추론하기'와 같습니다. 달의 위상(사리·조금)과 연결해 2주 자료로 확장할 수 있습니다.","time":"1~2차시","textbook":"미래엔 지구시스템과학 Ⅱ단원 탐구 '실시간 자료를 이용한 조석 현상의 양상 추론하기'"},{"id":"ess-0302","subj":"ess","code":"12지시03-02","title":"지구 복사 수지 자료로 지표·대기 열 출입 해석하기","questions":["같은 기간의 CERES 자료에서 지표와 대기권 상단의 순복사는 각각 얼마이며, 단파·장파 복사 플럭스는 어떻게 기여할까?","위도·계절별 순복사 차이는 에너지 수송과 어떻게 연결될까?"],"data":{"name":"지구 복사 수지·열수지 자료","org":"NASA CERES","url":"https://ceres.larc.nasa.gov/data/","how":"대기권 상단(TOA)과 지표(Surface)의 월평균 상향·하향 단파·장파 복사 플럭스를 같은 기간으로 수집합니다. 잠열·현열 자료는 별도 출처와 정의를 명시하고, 서로 다른 고도 기준의 항목을 섞지 않습니다."},"vars":[{"n":"상향·하향 단파·장파 복사 플럭스","u":"W/m²","r":"부호·고도 확인"},{"n":"위도·계절","u":"°·월","r":"자료 기간 확인"},{"n":"순복사","u":"W/m²","r":"수준별 부호 규약 확인"}],"tasks":["지표·대기·대기권 상단의 열 출입 항목과 상향·하향 복사 구별하기","같은 고도 기준에서 순복사=(하향 단파−상향 단파)+(하향 장파−상향 장파) 계산하기","위도별 순복사를 그래프로 나타내고 cos(위도) 면적 가중 평균으로 전 지구 에너지 과부족 해석하기"],"chart":"지표·대기권 상단별 복사 수지 흐름도 + 위도별 순복사 그래프","predict":"전 지구 평균과 적도 지역의 순복사가 같은지 예상하세요.","checks":[{"t":"상향·하향 단파·장파 플럭스의 부호를 적용해 순복사를 계산했는가?","h":"자료별 부호 정의를 먼저 확인하고 같은 고도 기 "],"data":{"name":"라디오존데 기압·고도·기온 프로파일","org":"NOAA IGRA / 기상청","url":"https://www.ncei.noaa.gov/products/weather-balloon/integrated-global-radiosonde-archive","how":"같은 관측소·시각의 기압·고도·기온을 수집하고 결측 부호와 고도 정의를 확인합니다."},"vars":[{"n":"기압","u":"hPa","r":"양수"},{"n":"고도","u":"m","r":"관측 정의 확인"},{"n":"기온","u":"K 또는 °C","r":"변환 필요"}],"tasks":["기압–고도 분포와 층별 감소율 비교하기","정역학 관계로 기압 경도력과 중력의 균형 해석하기","가열·부력·수렴 등의 연직 운동 원인을 추가 자료·개념으로 추론하기"],"chart":"기압–고도 프로파일과 층별 감소율","predict":"같은 높이 간격의 기압 차이가 상층과 하층에서 같을지 예상하세요.","checks":[{"t":"hPa를 Pa로 바꾸어 힘 관계를 계산했는가?","h":"1 hPa는 100 Pa입니다."},{"t":"정역학 균형을 연직 운동의 완전한 부재로 단정하지 않았는가?","h":"큰 힘의 근사 균형과 작은 연직 가속은 구별합니다."}],"pitfalls":["기압 감소를 선형으로 외삽함","연직 기압 분포 하나로 실제 상승 속도를 확정함"],"time":"2차시","textbook":"지구시스템과학 정역학적 균형에 연계한 재구성 활동."},{"id":"ess-0305","subj":"ess","code":"12지시03-05","title":"고도별 기압장과 바람으로 지균풍·경도풍·지상풍 비교하기","questions":["상층의 바람은 등고도선과 어떤 관계를 보일까?","곡률과 지면 마찰을 고려하면 풍향·풍속은 어떻게 달라질까?"],"data":{"name":"상층 지위고도·바람과 해면기압·지상풍","org":"기상청 / NOAA PSL 재분석","url":"https://psl.noaa.gov/data/","how":"같은 시각·중위도 해역의 상층 등압면 지위고도·바람과 지상 기압·바람을 수집합니다. 등압면과 등고도면을 구별합니다."},"vars":[{"n":"지위고도","u":"gpm","r":"등압면별 확인"},{"n":"해면기압","u":"hPa","r":"관측 범위"},{"n":"바람 성분","u":"m/s","r":"동서·남북 성분"}],"tasks":["등고도선과 상층 바람의 방향 비교하기","직선·곡선 흐름의 힘 균형으로 지균풍·경도풍 구별하기","지면 마찰을 고려해 지상풍의 등압선 횡단 설명하기"],"chart":"기압·지위고도 등치선과 바람 벡터 지도","predict":"지상풍이 상층 바람처럼 등압선과 나란할지 예상하세요.","checks":[{"t":"기상 풍향과 벡터가 향하는 방향을 구별했는가?","h":"기상 풍향은 불어오는 방향입니다."},{"t":"반구·마찰·곡률의 적용 조건을 밝혔는가?","h":"모형의 힘 균형은 조건에 따라 달라집니다."}],"pitfalls":["상층 등압면의 등고도선을 지상 등압선으로 부름","적도 부근에 지균풍 근사를 적용함"],"time":"2차시","textbook":"지구시스템과학 대기에 작용하는 힘과 바람에 연계한 활동."},{"id":"ess-0306","subj":"ess","code":"12지시03-06","title":"상층 편서풍 파동과 지상 기압계 발달 비교하기","questions":["상층 기압골·기압능이 이동할 때 지상 기압계는 어떻게 변할까?","한 사례로 편서풍 파동의 역할을 어디까지 평가할 수 있을까?"],"data":{"name":"연속 상층 일기도·지위고도와 지상 일기도","org":"기상청 / NOAA PSL","url":"https://www.weather.go.kr/","how":"중위도 저기압 발달 사례를 골라 6~12시간 간격의 상층 500 hPa와 지상 일기도를 같은 UTC로 정리합니다. 필요하면 발산·와도 자료를 추가합니다."},"vars":[{"n":"500 hPa 지위고도","u":"gpm","r":"자료별 확인"},{"n":"해면기압","u":"hPa","r":"자료별 확인"},{"n":"시각","u":"UTC","r":"같은 간격"}],"tasks":["기압골·기압능의 파장·이동을 추적하기","상층 파동과 지상 고·저기압 발달의 시간·위치 관계 비교하기","상층 발산·수렴 등의 개념으로 편서풍 파동의 역할과 사례 한계 평가하기"],"chart":"시각별 상층·지상 일기도 비교 패널","predict":"상층 기압골과 지상 저기압 중심이 항상 수직으로 겹칠지 예상하세요.","checks":[{"t":"상층·지상 자료의 시각과 지도 투영을 맞추었는가?","h":"UTC와 KST는 9시간 차이입니다."},{"t":"공간상 인접만으로 인과를 확정하지 않았는가?","h":"연속 시각과 발산·수렴 근거를 함께 봅니다."}],"pitfalls":["한 장의 일기도만으로 발달 과정을 결론냄","상층 기압골 위치를 지상 저기압 중심과 동일시함"],"time":"2차시","textbook":"지구시스템과학 행성파와 지상 기압계 발달에 연계한 활동."}],"standards":{"10통과1-01-01":"자연을 시간과 공간에서 기술할 수 있음을 알고, 길이와 시간 측정의 현대적 방법과 다양한 규모의 측정 사례를 조사할 수 있다.","10통과1-01-02":"과학 탐구에서 중요한 기본량의 의미를 알고, 자연 현상을 기술하는 데 단위가 가지는 의미와 적용사례를 설명할 수 있다.","10통과1-01-03":"과학 탐구에서 측정과 어림의 의미를 알고, 일상생활의 여러 가지 상황에서 측정 표준의 유용성과 필요성을 논증할 수 있다.","10통과1-01-04":"자연에서 일어나는 다양한 변화를 측정⋅분석하여 정보를 산출함을 알고, 이러한 정보를 디지털로 변환하는 기술을 정보 통신에 활용하여 현대 문명에 미친 영향을 인식한다.","10통과1-02-01":"천체에서 방출되는 빛의 스펙트럼을 분석하여 우주 초기에 형성된 원소와 천체의 구성 물질을 추론할 수 있다.","10통과1-02-02":"우주 초기의 원소들로부터 태양계의 재료이면서 생명체를 구성하는 원소들이 형성되는 과정을 통해 지구와 생명의 역사가 우주 역사의 일부분임을 해석할 수 있다.","10통과1-02-03":"세상을 구성하는 원소들의 성질이 주기성을 나타내는 현상을 통해 자연의 규칙성을 도출하고, 지구와 생명체를 구성하는 주요 원소들이 결합을 형성하는 이유를 해석할 수 있다.","10통과1-02-04":"인류의 생존에 필수적인 물, 산소, 소금 등이 만들어지는 결합의 차이를 이해하고 각 물질의 성질과 관련지어 설명할 수 있다.","10통과1-02-05":"지각과 생명체를 구성하는 물질들이 기본 단위체의 결합을 통해서 형성된다는 것을 규산염 광물, 단백질과 핵산의 예를 통해 설명할 수 있다.","10통과1-02-06":"지구를 구성하는 물질을 전기적 성질에 따라 구분할 수 있고, 물질의 전기적 성질을 응용하여 일상생활과 첨단기술에서 다양한 소재로 활용됨을 인식한다.","10통과1-03-01":"지구시스템은 태양계라는 시스템의 구성요소임을 알고, 지구시스템을 구성하는 권역들 간의 물질 순환과 에너지 흐름의 결과로 나타나는 현상을 논증할 수 있다.","10통과1-03-02":"지권의 변화를 판구조론 관점에서 해석하고, 에너지 흐름의 결과로 발생하는 지권의 변화가 지구시스템에 미치는 영향을 추론할 수 있다.","10통과1-03-03":"중력의 작용으로 인한 지구 표면과 지구 주위의 다양한 운동을 설명할 수 있다.","10통과1-03-04":"상호작용이 없을 때 물체가 가속되지 않음을 알고, 충격량과 운동량의 관계를 충돌 관련 안전장치와 스포츠에 적용할 수 있다.","10통과1-03-05":"생명 시스템을 유지하기 위해서 다양한 화학 반응과 물질 출입이 필요함을 이해하고, 일상생활에서 활용되는 화학 반응 사례를 조사하여 발표할 수 있다.","10통과1-03-06":"생명 시스템의 유지에 필요한 세포 내 정보의 흐름을 유전자로부터 단백질이 만들어지는 과정을 중심으로 설명할 수 있다.","10통과2-01-01":"지질시대를 통해 지구 환경이 끊임없이 변화해 왔으며 이러한 환경 변화가 생물다양성에 미치는 영향을 추론할 수 있다.","10통과2-01-02":"변이의 발생과 자연선택 과정을 통해 생물의 진화가 일어나고, 진화의 과정을 통해 생물다양성이 형성되었음을 추론할 수 있다.","10통과2-01-03":"자연과 인류의 역사에 큰 변화를 가져온 광합성, 화석 연료 사용, 철의 제련 등에서 공통점을 찾아 산화와 환원을 이해하고, 생활 주변의 다양한 변화를 산화와 환원의 특징과 규칙성으로 분석할 수 있다.","10통과2-01-04":"대표적인 산⋅염기 물질의 특징을 알고, 산과 염기를 혼합할 때 나타나는 중화 반응을 생활 속에서 이용할 수 있다.","10통과2-01-05":"생활 주변에서 에너지를 흡수하거나 방출하는 현상을 찾아 에너지의 흡수 방출이 우리 생활에 어떻게 이용되는지 토의할 수 있다.","10통과2-02-01":"생태계 구성요소를 이해하고 생물과 환경 사이의 상호 관계를 설명할 수 있다.","10통과2-02-02":"먹이 관계와 생태 피라미드를 중심으로 생태계 평형이 유지되는 과정을 이해하고, 환경의 변화가 생태계에 미칠 수 있는 영향에 대해 협력적으로 소통할 수 있다.","10통과2-02-03":"온실효과 강화로 인한 지구온난화의 메커니즘을 이해하고, 엘니뇨, 사막화 등과 같은 현상이 지구 환경과 인간 생활에 미치는 영향과 대처 방안을 분석할 수 있다.","10통과2-02-04":"태양에서 수소 핵융합 반응을 통해 질량 일부가 에너지로 바뀌고, 그중 일부가 지구에서 에너지 흐름을 일으키며 다양한 에너지로 전환되는 과정을 추론할 수 있다.","10통과2-02-05":"발전기에서 운동 에너지가 전기 에너지로 전환되는 과정을 이해하고, 열원으로서 화석 연료, 핵에너지를 이용하는 발전소가 인간 생활에 미치는 영향을 조사⋅발표할 수 있다.","10통과2-02-06":"에너지 효율의 의미와 중요성을 이해하고, 지속가능한 발전과 지구 환경 문제 해결에 신재생 에너지 기술을 활용하는 방안을 탐색할 수 있다.","10통과2-03-01":"감염병의 진단, 추적 등을 사례로 과학의 유용성을 설명하고, 미래 사회 문제 해결에서 과학의 필요성에 대해 논증할 수 있다.","10통과2-03-02":"빅데이터를 과학기술사회에서 사용하고 있는 사례를 조사하고, 빅데이터 활용의 장점과 문제점을 추론할 수 있다.","10통과2-03-03":"인공지능 로봇, 사물인터넷 등과 같이 과학기술의 발전을 인간 삶과 환경 개선에 활용하는 사례를 찾고, 이러한 과학기술의 발전이 미래 사회에 미치는 유용성과 한계를 예측할 수 있다.","10통과2-03-04":"과학기술의 발전 과정에서 발생할 수 있는 과학 관련 사회적 쟁점(SSI)과 과학기술 이용에서 과학 윤리의 중요성에 대해 논증할 수 있다.","12지구01-01":"해수의 물리적, 화학적 성질을 이해하고, 실측 자료를 활용하여 해수의 온도, 염분, 밀도, 용존 산소량 등의 분포를 분석⋅해석할 수 있다.","12지구01-02":"심층 순환의 발생 원리와 분포를 알고, 표층 순환 및 기후변화의 관련성을 추론할 수 있다.","12지구01-03":"중위도 저기압과 고기압이 통과할 때 날씨의 변화를 일기도, 위상 영상, 레이더 영상을 종합하여 예측할 수 있다.","12지구01-04":"태풍의 발생, 이동, 소멸 과정 및 태풍 영향권에서 날씨를 예측하고, 뇌우, 집중호우, 폭설, 강풍, 황사 등 주요 악기상의 생성 메커니즘과 대처 방안을 제시할 수 있다.","12지구01-05":"대기와 해양의 상호작용의 사례로서 해수의 용승과 침강, 엘니뇨-남방진동(ENSO)의 현상의 진행 과정 및 관련 현상을 설명할 수 있다.","12지구01-06":"기후변화의 원인을 자연적 요인과 인위적 요인으로 구분하여 설명하고, 인간 활동에 의한 기후변화 문제를 과학적으로 해결하는 방법을 탐색할 수 있다.","12지구02-01":"지층 형성의 선후 관계를 결정짓는 법칙들을 활용하여 상대 연령을 비교하고, 방사성 동위 원소를 이용한 광물의 절대 연령 자료로 암석의 절대 연령을 구할 수 있다.","12지구02-02":"지질시대를 기(紀) 수준에서 구분하고, 지층과 화석을 통해 지질시대의 생물과 환경 변화를 해석할 수 있다.","12지구02-03":"변동대에서 마그마가 생성되고, 그 조성에 따라 다양한 화성암이 생성됨을 설명할 수 있다.","12지구02-04":"변성작용의 종류와 지각 변동에 따른 구조를 변동대와 관련지어 설명하고, 지구시스템에서 암석이 순환함을 추론할 수 있다.","12지구02-05":"우리나라의 대표적인 지질공원의 지질학적 형성 과정을 추론하고, 지역사회와 함께하는 지질공원의 지속가능한 발전방안을 제안할 수 있다.","12지구03-01":"태양-지구-달 시스템에서의 식 현상을 이해하고 모형을 이용하여 태양계 행성의 겉보기 운동을 설명할 수 있다.","12지구03-02":"별의 분광형 결정 및 별의 분류 과정을 이해하고, 흑체복사 법칙을 이용하여 별의 물리량을 추론할 수 있다.","12지구03-03":"다양한 질량을 가진 별의 진화 과정을 H-R도에 나타내고 해석할 수 있다.","12지구03-04":"허블의 은하 분류 체계에 따른 은하의 특징을 비교하고 외부은하의 자료를 이용하여 특이 은하의 관측적 특징을 추론할 수 있다.","12지구03-05":"허블-르메트르 법칙으로 우주의 팽창을 이해하고 우주의 진화에 대한 다양한 설명 체계의 의의를 현대 우주론의 관점에서 비교할 수 있다.","12지시01-01":"지구의 탄생 이후 지구 대기, 원시 바다, 생명체 탄생 등의 과정을 통한 지구시스템 각 권역의 형성 과정을 추론할 수 있다.","12지시01-02":"지구시스템이 진화해온 역사에서 물, 탄소, 산소의 순환 과정을 통해 지권, 수권, 기권이 변화해 왔음을 추적할 수 있다.","12지시01-03":"판구조론의 발달사와 관련지어 판을 움직이는 맨틀의 상부 운동과 플룸에 의한 구조 운동을 구분할 수 있다.","12지시01-04":"암석의 순환 과정에서 화산 활동의 역할과 화산 활동으로 생성되는 암석의 특성을 추론할 수 있다.","12지시01-05":"지진파의 종류와 특성을 이해하고, 지진파를 이용하여 지구 내부구조를 알아내는 과정을 탐구할 수 있다.","12지시02-01":"에크만 수송과 관련지어 지형류의 발생 원리를 설명할 수 있다.","12지시02-02":"해파의 발생 과정을 이해하고, 천해파와 심해파의 차이점을 비교⋅설명할 수 있다.","12지시02-03":"해일이 발생하는 여러 가지 원인을 이해하고, 피해 사례와 대처 방안을 제안할 수 있다.","12지시02-04":"조석의 발생 과정을 이해하고 자료 해석을 통해 각 지역에서의 조석 양상을 설명할 수 있다.","12지시03-01":"대기를 구성하는 기체들이 선택적 흡수체임을 이해하고, 온실효과 및 태양 자외선 차단 효과, 물의 존재 등으로 지구 생명체 존재 조건을 추론할 수 있다.","12지시03-02":"지표와 대기의 열 출입과 관련된 물리 과정 및 전 지구 평균 열수지를 해석할 수 있다.","12지시03-03":"기온의 연직 분포와 대기의 안정도와의 관계를 이해하고, 단열변화를 통해 안개나 구름이 생성되는 과정 및 강수 과정을 분석할 수 있다.","12지시03-04":"기압의 연직 분포로 정역학적 균형을 이해하고, 대기 중 연직 운동의 발생 원인을 추론할 수 있다.","12지시03-05":"지균풍, 경도풍, 지상풍의 발생 원리와 관련된 힘의 작용을 설명할 수 있다.","12지시03-06":"행성파의 발달 과정을 이해하고, 지상 고⋅저기압 발달에서 편서풍 파동의 역할을 평가할 수 있다."},"levels":{"12지구01-01":{"act":["인공위성 및 ARGO 자료로 해수의 성질 비교하기"],"A":"해수의 물리적, 화학적 성질에 영향을 미치는 요인과 그 특징을 설명하고, T-S 다이어그램을 이용하여 밀도를 구하며, 인공위성 및 ARGO의 디지털 실측 자료를 수온, 염분, 밀도, 용존 산소량 분포를 나타내는 그래프로 변환하고 변환한 그래프를 해석하여 해수의 성질을 비교할 수 있다.","B":"해수의 물리적, 화학적 성질에 영향을 미치는 요인과 그 특징을 설명하고, T-S 다이어그램을 이용하여 밀도를 구하며, 인공위성 및 ARGO의 디지털 실측 자료를 수온, 염분, 밀도, 용존 산소량 분포를 나타내는 그래프로 변환할 수 있다.","C":"해수의 물리적, 화학적 성질에 영향을 미치는 요인과 그 특징을 설명하고, T-S 다이어그램을 이용하여 밀도를 구하며, 해수의 온도, 염분 분포 그래프를 해석할 수 있다.","D":"해수의 물리적, 화학적 성질에 영향을 미치는 요인을 제시하고, T-S 다이어그램을 이용하여 밀도를 구할 수 있다.","E":"해수의 밀도가 주로 수온과 염분의 영향을 받음을 말할 수 있다."},"12지구01-02":{"act":[],"A":"심층 순환의 발생 원리 및 심층 순환을 이루는 대표적인 수괴의 분포와 이동을 밀도 차와 관련지어 설명하고, 심층 순환과 표층 순환이 연결됨을 이해하여 해양 순환의 변화 양상과 기후변화의 관련성을 추론할 수 있다.","B":"심층 순환의 발생 원리 및 심층 순환을 이루는 대표적인 수괴의 분포와 이동을 밀도 차와 관련지어 설명하고, 심층 순환과 표층 순환이 연결되어 해수가 순환함을 말할 수 있다.","C":"심층 순환의 발생 원리와 대표적인 침강 해역에서의 해수의 물리적 특성을 설명하고, 심층 순환과 표층 순환이 연결되어 해수가 순환함을 말할 수 있다.","D":"심층 순환이 밀도 차에 의해 발생함과 심층 순환과 표층 순환이 연결되어 해수가 순환하고 있음을 말할 수 있다.","E":"심층 순환이 밀도 차에 의해 발생함을 말할 수 있다."},"12지구01-03":{"act":["일기도와 위성 및 레이더 영상 등을 이용하여 기압계와 연관된 과거 날씨 분석하기"],"A":"중위도 저기압을 종관 규모와 중규모의 저기압으로 구분하여 설명하고, 중위도 저기압과 고기압이 통과할 때 기상 요소의 변화를 우리나라 주변의 일기도, 위성 영상, 레이더 영상을 종합적으로 해석하여 예측하며, 날씨를 예측할 수 있는 과학의 유용성을 인식한다.","B":"중위도 저기압을 종관 규모와 중규모의 저기압으로 구분하여 설명하고, 중위도 저기압과 고기압이 통과할 때 기상 요소의 변화를 일기도, 위성 영상, 레이더 영상을 종합적으로 해석하여 설명할 수 있다.","C":"중위도 저기압을 종관 규모와 중규모의 저기압으로 구분하고, 중위도 저기압과 고기압이 통과할 때 기상 요소의 변화를 일기도에서 설명할 수 있다.","D":"우리나라 주변의 일기도에서 중위도 저기압과 고기압을 찾고, 주변 날씨를 말할 수 있다.","E":"우리나라 주변의 일기도에서 중위도 저기압을 찾고, 주변 날씨를 말할 수 있다."},"12지구01-04":{"act":[],"A":"태풍의 발생, 이동, 소멸 과정을 설명하고 태풍 영향권에서의 날씨 변화를 예측하며, 주요 악기상의 특징, 피해 사례, 생성 메커니즘에 대한 이해를 바탕으로 악기상의 피해를 최소화하기 위한 과학적 대처 방안을 제시할 수 있다.","B":"태풍의 발생 조건을 제시하고 태풍 영향권에서의 날씨 변화를 예측하며, 주요 악기상의 특징과 피해 사례에 대한 이해를 바탕으로 악기상의 피해를 최소화하기 위한 사회적 관리의 중요성을 인식한다.","C":"태풍 영향권에서의 날씨 변화를 예측하고, 주요 악기상의 특징과 피해 사례에 대한 이해를 바탕으로 악기상의 피해를 최소화하기 위한 사회적 관리의 중요성을 인식한다.","D":"태풍 영향권에서의 날씨 변화를 예측하고, 주요 악기상을 구분하며, 악기상으로 인한 피해의 심각성을 인식한다.","E":"우리나라에 나타나는 주요 악기상의 종류를 제시하고, 악기상으로 인한 피해의 심각성을 인식한다."},"12지구01-05":{"act":[],"A":"해수의 용승과 침강, 엘니뇨-남방진동(ENSO)의 발생 및 진행 과정과 이와 관련되어 나타나는 현상을 대기와 해양의 상호작용의 관점에서 설명하고, 전 지구 function copyCode(button, code) {
  const originalText = button.textContent;
  const copied = () => {
    button.textContent = "복사됨";
    window.setTimeout(() => { button.textContent = originalText; }, 1600);
  };
  const fallback = () => {
    const input = document.createElement("textarea");
    input.value = code;
    input.setAttribute("readonly", "");
    input.className = "copy-input";
    document.body.appendChild(input);
    input.select();
    const succeeded = document.execCommand("copy");
    input.remove();
    if (succeeded) copied();
    else button.textContent = "직접 선택해 복사하세요";
  };

  if (!navigator.clipboard?.writeText) {
    fallback();
    return;
  }
  navigator.clipboard.writeText(code).then(copied, fallback);
}

      `- 출처: ${answer(state, "source") || `${activity.data.org} ${activity.data.name}`}`,
      `- 기간: ${answer(state, "period") || "(§2에서 기간을 쓰세요)"}`,
      `- 지역·대상: ${answer(state, "place") || "(§2에서 지역을 쓰세요)"}`,
    ];
    if (variables.length) {
      lines.push("- 사용할 변수:");
      variables.forEach(variable => lines.push(`  ${variable}`));
    }
    if (answer(state, "data_note")) lines.push(`- 참고: ${answer(state, "data_note")}`);
    lines.push("- 첨부한 파일을 사용해. 파일에 없는 값은 지어내지 마.", "");

    (tasks.length ? tasks : ["(위에서 작업을 고르세요)"]).forEach((task, index) => lines.push(`${index + 1}. ${task}`));

    if (constraints.length) {
      lines.push("", "[조건]");
      constraints.forEach(constraint => lines.push(`- ${constraint}`));
    }
    return lines.join("\n");
  }

  function promptText() {
    return state.version === "A"
      ? (answer(state, "prompt_final") || assemblePrompt())
      : answer(state, "prompt_free");
  }

  function downloadSummary() {
    const date = new Date();
    const dateText = [
      date.getFullYear(),
      String(date.getMonth() + 1).padStart(2, "0"),
      String(date.getDate()).padStart(2, "0"),
    ].join("-");
    const filename = `워크시트_${classCode(state.act, state.version)}_${dateText}.txt`;
    const blob = new Blob([`\uFEFF${summaryText()}`], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.append(link);
    link.click();
    link.remove();
    window.setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function summaryText() {
    const activity = data.activities.find(item => item.id === state.act);
    const lines = [];
    const addLine = (label, value) => {
      if (String(value || "").trim()) lines.push(`${label}: ${value}`);
    };
    lines.push(`[지구과학 데이터 탐구 프롬프트 워크시트] ${activity.title}`);
    lines.push(`성취기준 [${activity.code}] ${data.standards[activity.code]}`);
    lines.push(`수업 코드 ${classCode(activity.id, state.version)} (${VERSIONS[state.version].name})`);
    addLine("이름", answer(state, "name"));
    addLine("AI 도구", answer(state, "tool"));
    lines.push(`검증 상태: ${verificationStatus(state.version, state.ans, checkList()) === "pass" ? "모든 판정·근거 기록 및 예측 일치 (정확성의 자동 보증 아님)" : "미완료 또는 재검토 필요"}`);
    lines.push("", "§0 역할 선언");
    addLine("역할 선언", [
      isChecked(state, "decl1") && "탐구자 선언",
      isChecked(state, "decl2") && "결과는 가설",
      isChecked(state, "decl3") && "정직한 기록",

    addLine("나만의 약속", answer(state, "decl_own"));
    addLine("사전 AI 신뢰도(1~5)", answer(state, "pre_trust"));
    lines.push("", "§1 탐구 문제");
    addLine("탐구 질문", answer(state, "question"));
    addLine("질문 유형", (Q_TYPES.find(item => item.k === answer(state, "qtype")) || {}).b);
    addLine("고른 이유", answer(state, "q_why"));
    lines.push("", "§2 데이터 맥락");
    addLine("출처", answer(state, "source") || `${activity.data.org} ${activity.data.name}`);
    addLine("기간", answer(state, "period"));
    addLine("지역·대상", answer(state, "place"));
    if (state.version === "A") {
      const variables = activity.vars
        .filter((variable, index) => answer(state, `var_${index}`))
        .map(variable => `${variable.n}(${variable.u})`);
      addLine("변수", variables.join(", "));
    } else if (state.version === "B") {
      activity.vars.forEach((variable, index) => {
        const unit = answer(state, `vu_${index}`);
        const range = answer(state, `vr_${index}`);
        if (unit || range) lines.push(`${variable.n}: 단위 ${unit} / 범위 ${range}`);
      });
    } else {
      addLine("변수", answer(state, "vars_free"));
    }
    addLine("자료 메모", answer(state, "data_note"));
    lines.push("", "§2.5 나의 예측");
    addLine("경향", answer(state, "trend"));
    addLine("범위", (answer(state, "p_min") || answer(state, "p_max"))
      ? `${answer(state, "p_min")} ~ ${answer(state, "p_max")} ${answer(state, "p_unit")}`
      : "");
    addLine("그래프 모양", answer(state, "p_shape"));
    addLine("이유", answer(state, "why"));
    lines.push("", "§3 프롬프트", promptText() || "(없음)");
    if (state.version === "C") addLine("자기 평가(1~5)", answer(state, "p_self"));
    lines.push("", "§4 결과 검증");
    addLine("예측과 결과 비교", answer(state, "prediction_match") === "match" ? "일치" : answer(state, "prediction_match") === "differ" ? "불일치" : "");
    addLine("AI 결과", answer(state, "ai_result"));
    const labels = { ok: "맞음", bad: "문제 있음", unk: "모르겠음" };
    checkList().forEach(item => {
      const checked = answer(state, `chk_${item.id}`);
      const note = answer(state, `chkn_${item.id}`);
      if (checked || note) lines.push(`- [${labels[checked] || "미확인"}] ${item.t}${note ? ` / ${note}` : ""}`);
    });
    lines.push("", "§5 수정·반복");
    const roundCount = Math.max(1, Number(answer(state, "rounds_n")) || 1);
    for (let index = 0; index < roundCount; index++) {
      const problem = answer(state, `r${index}_problem`);
      const prompt = answer(state, `r${index}_prompt`);
      const change = answer(state, `r${index}_change`);
      if (problem || prompt || change) {
        lines.push(`${index + 1}회차`);
        addLine("  문제", problem);
        addLine("  수정 프롬프트", prompt);
        addLine("  변화", change);
      }
    }
    lines.push("", "§6 성찰");
    addLine("사후 AI 신뢰도(1~5)", answer(state, "post_trust"));
    addLine("결론", answer(state, "conclusion"));
    addLine("AI가 한 일과 내가 판단한 일", answer(state, "who"));
    addLine("찾은 오류", answer(state, "errors"));
    addLine("동의하지 않는 부분", answer(state, "disagree"));
    addLine("다음에 바꿀 점", answer(state, "next"));
    addLine("성취수준 자기 점검", answer(state, "self_level"));
    addLine("역할 선언", state.version === "B" ? `나: ${answer(state, "role_self")} / AI: ${answer(state, "role_ai")} / 검증: ${answer(state, "role_check")}` : answer(state, "decl_own"));
    addLine("자유 데이터 맥락", answer(state, "context_free"));
    addLine("자유 예측", answer(state, "prediction_free"));
    addLine("자유 성찰", answer(state, "reflection_free"));
    ["source", "concept", "evidence", "limits"].forEach(key => addLine(`성찰 점검 ${key}`, answer(state, `reflect_${key}`) ? "확인" : ""));
    if (state.ans._verificationHistory?.length) {
      lines.push("", "재실행 전 검증 이력", JSON.stringify(state.ans._verificationHistory, null, 2));
    }
    return lines.join("\n");
  }

  if (!document.getElementById("storageWarning")) {
    const warning = document.createElement("p");
    warning.id = "storageWarning";
    warning.className = "error wrap";
    warning.setAttribute("role", "alert");
    warning.textContent = "브라우저 저장소를 읽거나 저장하지 못했습니다. 자동 저장을 신뢰하지 말고 ‘정리’에서 기록을 복사·저장하세요.";
    app.before(warning);
  }
}

const state = {
  mode: "teacher",
  subj: "es",
  sel: null,
  teacherActivity: null,
  version: "A",
  act: null,
  step: 0,
  ans: {},
};

function readStorage(key) {
  try {
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : null;
  } catch (error) {
    reportStorageError(error);
    return null;
  }
}

function writeStorage(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (error) {
    reportStorageError(error);
  }
}

function saveLastView() {
  writeStorage("evc:last", {
    mode: state.mode,
    subj: state.subj,
    sel: state.sel,
    teacherActivity: state.teacherActivity,
    version: state.version,
    act: state.act,
    step: state.step,
  });
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;",
  })[character]);
}

function footerMarkup() {
  const contact = CONFIG.contact.trim();
  return `
    <p class="foot">성취기준 출처: 교육부 고시 제2022-33호 [별책 9] 과학과 교육과정(62개 원문 대조). 성취수준: 2022 개정 교육과정에 따른 고등학교 과학과 선택과목 성취수준(현장 보급본). 활동은 교과서와 연계하거나 새로 구성했으며 교과서 본문은 옮기지 않았습니다. 공개 관측값과 실험·문헌·교사 제공 모형 자료를 구별해 사용하세요. A·B·C 구조는 KACE 투고본 표 3을 따르며, 교육적 효과가 검증되었다는 뜻은 아닙니다. 입력 내용은 이 브라우저에만 저장됩니다.</p>
    <p class="foot-meta">
      <span>버전: ${escapeHtml(CONFIG.appVersion)}</span>
      <span>연구자: ${escapeHtml(CONFIG.researcher)}</span>
      ${contact ? `<a href="mailto:${escapeHtml(contact)}">문의: ${escapeHtml(contact)}</a>` : ""}
    </p>`;
}

function setMode(mode, previewStep) {
  if (flushStudentAnswers) flushStudentAnswers();
  flushStudentAnswers = null;
  state.mode = mode;
  state.previewStep = Number.isInteger(previewStep) ? previewStep : null;
  modeTeacher.setAttribute("aria-pressed", String(mode === "teacher"));
  modeStudent.setAttribute("aria-pressed", String(mode === "student"));
  saveLastView();
  render();
}

function render() {
  if (!worksheetData) return;
  surveyLink.hidden = state.mode !== "teacher" || !CONFIG.surveyUrl.trim();
  if (!surveyLink.hidden) surveyLink.href = CONFIG.surveyUrl;
  if (state.mode === "teacher") {
    document.getElementById("topSub").textContent = "교사 화면 · 성취기준에서 활동과 비계 수준 고르기";
    renderTeacher(app, worksheetData, state, {
      footer: footerMarkup,
      readStorage,
      setMode,
      saveLastView,
      writeStorage,
    });
  } else {
    document.getElementById("topSub").textContent = "학생 화면 · 수업 코드로 시작하기";
    renderStudent(app, worksheetData, state, {
      footer: footerMarkup,
      setMode,
      readStorage,
      writeStorage,
      saveLastView,
      registerFlush: flush => { flushStudentAnswers = flush; },
    });
  }
}

async function loadData() {
  const embedded = document.getElementById("worksheet-data");
  const embeddedData = embedded ? JSON.parse(embedded.textContent) : null;
  const files = [
    ["activities", "../data/activities.json"],
    ["extraActivities", "../data/activities-extra.json"],
    ["standards", "../data/standards.json"],
    ["levels", "../data/levels.json"],
  ];

  const entries = await Promise.all(files.map(async ([name, path]) => {
    if (embeddedData) {
      if (!Object.hasOwn(embeddedData, name)) throw new Error(`Missing embedded worksheet data: ${name}`);
      return [name, embeddedData[name]];
    }
    const response = await fetch(new URL(path, document.baseURI));
    if (!response.ok) {
      throw new Error(`Failed to load ${name}: HTTP ${response.status}`);
    }
    return [name, await response.json()];
  }));

  const data = Object.fromEntries(entries);
  data.activities.push(...data.extraActivities);
  const ids = new Set();
  for (const activity of data.activities) {
    if (ids.has(activity.id) || !data.standards[activity.code] || !activity.questions?.length
      || !activity.vars?.length || !activity.checks?.length || !activity.tasks?.length) {
      throw new Error(`활동 데이터의 ID·성취기준·필수 필드를 확인하세요: ${activity.id}`);
    }
    ids.add(activity.id);
  }
  return data;
}

function restoreState(data) {
  const last = readStorage("evc:last");
  if (last) {
    state.mode = last.mode === "student" ? "student" : "teacher";
    state.subj = SUBJ[last.subj] ? last.subj : "es";
    state.sel = typeof last.sel === "string" ? last.sel : null;
    state.teacherActivity = data.activities.some(a => a.id === last.teacherActivity) ? last.teacherActivity : null;
    state.version = ["A", "B", "C"].includes(last.version) ? last.version : "A";
    state.step = Number.isInteger(last.step) && last.step >= 0 && last.step < 9 ? last.step : 0;
    state.act = data.activities.some(activity => activity.id === last.act) ? last.act : null;
  }
  modeTeacher.setAttribute("aria-pressed", String(state.mode === "teacher"));
  modeStudent.setAttribute("aria-pressed", String(state.mode === "student"));
}

modeTeacher.addEventListener("click", () => setMode("teacher"));
modeStudent.addEventListener("click", () => setMode("student"));

try {
  worksheetData = await loadData();
  restoreState(worksheetData);
  const sharedActivity = parseCode(location.hash, worksheetData.activities);
  if (sharedActivity) {
    state.mode = "student";
    state.act = sharedActivity.id;
    state.version = sharedActivity.version;
    state.ans = readStorage(`evc:${state.act}:${state.version}`) || {};
    state.step = Number.isInteger(state.ans._step) ? state.ans._step : 0;
    saveLastView();
  }
  modeTeacher.setAttribute("aria-pressed", String(state.mode === "teacher"));
  modeStudent.setAttribute("aria-pressed", String(state.mode === "student"));
  render();
} catch (error) {
  console.error("워크시트 자료를 불러오지 못했습니다.", error);
  app.innerHTML = '<p class="error" role="alert">자료를 불러오지 못했습니다. 페이지를 새로고침해 주세요.</p>';
}

window.addEventListener("pagehide", () => {
  if (flushStudentAnswers) flushStudentAnswers();
  saveLastView();
});



return {  };
})();
})().catch(error => {
  console.error("워크시트 실행 오류", error);
  document.getElementById("app").textContent = "워크시트를 실행하지 못했습니다. 최신 Chrome 또는 Edge에서 다시 열어 주세요.";
});
</script>
